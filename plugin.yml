name: EChest
version: 1.0.0
main: EChest\Main
api:
  - 5.0.0

author: ZyberPE
description: Portable Ender Chest with staff viewing and editing support.

commands:
  echest:
    description: Open your Ender Chest
    usage: "/echest [see <player>]"
    aliases:
      - ec
      - enderchest
    permission: echest.command

permissions:
  echest.command:
    description: Allows use of /echest
    default: true

  echest.view:
    description: Allows viewing another player's Ender Chest
    default: op

  echest.edit:
    description: Allows editing another player's Ender Chest
    default: op

  echest.admin:
    description: Grants all EChest permissions
    default: op
    children:
      echest.view: true
      echest.edit: true
